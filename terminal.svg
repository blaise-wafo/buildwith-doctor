<text x="22" y="58" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#ffffff">sudo ./buildwith-doctor.sh --scan --quick</tspan></text>
<text x="22" y="100" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#ff7b72">♥ </tspan><tspan fill="#ffffff" font-weight="700">Auscultation : Mémoire &amp; swap </tspan><tspan fill="#39c5cf">███░░░░░░░░░░░░░</tspan><tspan fill="#8b949e"> (3/15)</tspan></text>
<text x="22" y="121" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#8b949e">  • </tspan><tspan fill="#8b949e">RAM 15.52 Gio — disponible 9.01 Gio (58%) — swap 2.00 Gio</tspan></text>
<text x="22" y="142" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#3fb950">  ✔ </tspan><tspan fill="#c9d1d9">Mémoire disponible : 58%</tspan></text>
<text x="22" y="163" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#d29922">  ▲ </tspan><tspan fill="#ffffff" font-weight="700">Swap très utilisé (72%)</tspan></text>
<text x="22" y="184" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#3fb950">  ✔ </tspan><tspan fill="#c9d1d9">Aucun OOM-kill depuis le démarrage</tspan></text>
<text x="22" y="226" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#ff7b72">♥ </tspan><tspan fill="#ffffff" font-weight="700">Auscultation : Stockage &amp; systèmes de fichiers </tspan><tspan fill="#39c5cf">████░░░░░░░░░░░░</tspan><tspan fill="#8b949e"> (4/15)</tspan></text>
<text x="22" y="247" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#f85149">  ✘ </tspan><tspan fill="#ffffff" font-weight="700">Partition / pleine à 96%</tspan><tspan fill="#8b949e"> — ext4 (ext4), 3.10 Gio libres</tspan></text>
<text x="22" y="268" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#3fb950">  ✔ </tspan><tspan fill="#c9d1d9">Inodes : OK</tspan></text>
<text x="22" y="289" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#3fb950">  ✔ </tspan><tspan fill="#c9d1d9">Journal noyau : aucune erreur de stockage</tspan></text>
<text x="22" y="331" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#76e3ea" font-weight="700">━━ DIAGNOSTIC ━━</tspan></text>
<text x="22" y="373" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#ffffff" font-weight="700">  Indice de santé  </tspan><tspan fill="#d29922">█████████████</tspan><tspan fill="#8b949e">░░░░░░░</tspan><tspan fill="#d29922" font-weight="700">  69/100</tspan><tspan fill="#c9d1d9"> — À soigner</tspan></text>
<text x="22" y="394" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#f85149">  ✘ 1 critique(s)</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#d29922">▲ 2 avertissement(s)</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#58a6ff">ℹ 3 info(s)</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#3fb950">✔ 38 contrôle(s) réussi(s)</tspan></text>
<text x="22" y="436" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#f85149" font-weight="700">  CRITIQUE</tspan></text>
<text x="22" y="457" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#f85149">  ✘  1. </tspan><tspan fill="#ffffff" font-weight="700">Partition / pleine à 96% </tspan><tspan fill="#8b949e">[disk]</tspan></text>
<text x="22" y="478" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#39c5cf">       Rx → </tspan><tspan fill="#c9d1d9">Nettoyer APT, journaux, caches, snaps, flatpak, fichiers temporaires</tspan></text>
