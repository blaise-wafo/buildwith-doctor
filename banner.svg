<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="BuildWith Doctor — le stéthoscope numérique pour Linux" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#14183a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="298" rx="21" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Stéthoscope -->
  <g transform="translate(50,28)" filter="url(#glow)">
    <!-- tuyaux -->
    <path d="M30 22 C 30 95, 62 128, 100 138" fill="none" stroke="url(#tube)" stroke-width="8" stroke-linecap="round"/>
    <path d="M170 22 C 170 95, 138 128, 100 138" fill="none" stroke="url(#tube)" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 138 L100 172" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
    <!-- embouts d'oreille -->
    <circle cx="30" cy="12" r="11" fill="#cbd5e1"/>
    <circle cx="30" cy="12" r="5" fill="#475569"/>
    <circle cx="170" cy="12" r="11" fill="#cbd5e1"/>
    <circle cx="170" cy="12" r="5" fill="#475569"/>
    <!-- pavillon -->
    <circle cx="100" cy="202" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="100" cy="202" r="20" fill="#0b1220" stroke="#4ade80" stroke-width="2" stroke-opacity="0.8"/>
    <!-- coeur -->
    <path d="M100 214 C 86 204, 85 192, 93 191 C 97 190.5, 100 194, 100 196 C 100 194, 103 190.5, 107 191 C 115 192, 114 204, 100 214 Z" fill="#f43f5e">
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1;1.1;1" keyTimes="0;0.15;0.3;0.45;1" dur="1.3s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>

  <!-- Titres -->
  <text x="300" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="9" fill="#94a3b8">BUILDWITH</text>
  <text x="298" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="4" fill="url(#title)">DOCTOR</text>
  <text x="300" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#e2e8f0">Le stéthoscope numérique de votre Linux</text>

  <!-- Étiquettes -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="300" y="198" width="86" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9"/>
    <text x="343" y="215" text-anchor="middle" fill="#7dd3fc">ausculte</text>
    <rect x="396" y="198" width="104" height="24" rx="12" fill="#facc15" fill-opacity="0.18" stroke="#facc15"/>
    <text x="448" y="215" text-anchor="middle" fill="#fde047">diagnostique</text>
    <rect x="510" y="198" width="72" height="24" rx="12" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80"/>
    <text x="546" y="215" text-anchor="middle" fill="#86efac">soigne</text>
    <rect x="898" y="22" width="80" height="26" rx="13" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e"/>
    <text x="938" y="40" text-anchor="middle" fill="#fda4af">v2.0.0</text>
  </g>

  <!-- Électrocardiogramme -->
  <g filter="url(#glow)">
    <path d="M285 262 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30" fill="none" stroke="#4ade80" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M285 262 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30 h40 l8 -14 l8 14 h14 l6 8 l10 -46 l12 62 l8 -24 h30" pathLength="1000" fill="none" stroke="#86efac" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="170 830" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="170;-1000" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M285 262 H960" stroke="#4ade80" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6"/>

  <text x="972" y="288" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#4ade80" fill-opacity="0.8">— by BuildWith —</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
