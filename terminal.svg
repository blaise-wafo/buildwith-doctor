<text x="22" y="541" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13.5"><tspan fill="#d29922">  ▲  2. </tspan><tspan fill="#ffffff" font-weight="700">Swap très utilisé (72%) </tspan><tspan fill="#8b949e">[memory]</tspan></text>
